# =============================================
# FoodV Backend — Docker Compose
# =============================================
version: "3.9"

services:
  # ── PostgreSQL 16 ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: foodv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-foodv_db}
      POSTGRES_USER: ${DB_USERNAME:-foodv_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foodv_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-foodv_user} -d ${DB_NAME:-foodv_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodv-network

  # ── pgAdmin 4 ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: foodv-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@foodv.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodv-network

  redis:
    image: redis:7-alpine
    container_name: foodv-redis
    ports:
      - "6380:6379"
    networks:
      - foodv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  foodv-network:
    driver: bridge
