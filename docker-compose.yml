# =============================================
# FoodV Backend — Docker Compose
# =============================================
version: "3.9"

services:
  # ── PostgreSQL 16 ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: foodv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-foodv_db}
      POSTGRES_USER: ${DB_USERNAME:-foodv_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foodv_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-foodv_user} -d ${DB_NAME:-foodv_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodv-network

  # ── pgAdmin 4 ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: foodv-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@foodv.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodv-network

  redis:
    image: redis:7-alpine
    container_name: foodv-redis
    ports:
      - "6380:6379"
    networks:
      - foodv-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FoodV AI Service ─────────────────────
  ai-service:
    build:
      context: ../foodv-ai-service
      dockerfile: Dockerfile
    container_name: foodv-ai-service
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AI_SERVICE_PORT: 8001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      API_SECRET_KEY: ${AI_SERVICE_SECRET_KEY:-change-me-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: redis://foodv-redis:6379
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-300}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - foodv-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  foodv-network:
    driver: bridge
