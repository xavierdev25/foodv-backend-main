name: FoodV Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodv_db
          POSTGRES_USER: foodv_user
          POSTGRES_PASSWORD: foodv_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Correr tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: foodv_db
          DB_USERNAME: foodv_user
          DB_PASSWORD: foodv_secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-de-minimo-32-caracteres-para-ci
          JWT_EXPIRATION: 86400000
          JWT_REFRESH_EXPIRATION: 604800000
          JWT_ISSUER: foodv-backend
          MERCADOPAGO_ACCESS_TOKEN: TEST-placeholder
          MERCADOPAGO_PUBLIC_KEY: TEST-placeholder
          MERCADOPAGO_WEBHOOK_SECRET: placeholder
          MERCADOPAGO_NOTIFICATION_URL: http://localhost:8080/api/payments/webhook
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
          AI_SERVICE_URL: http://localhost:8001
        run: ./mvnw test --no-transfer-progress

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build sin tests
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodv-backend-jar
          path: target/*.jar
          retention-days: 7