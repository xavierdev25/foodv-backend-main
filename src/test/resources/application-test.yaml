spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/foodv_db
    driver-class-name: org.postgresql.Driver
    username: foodv_user
    password: foodv_secret
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  docker:
    compose:
      lifecycle-management: none
  data:
    redis:
      host: localhost
      port: 6380
  cache:
    type: none

logging:
  level:
    root: WARN
    com.foodv.backend: INFO
    org.flywaydb: INFO

jwt:
  secret: test-secret-key-de-minimo-32-caracteres-para-tests
  expiration: 86400000
  refresh-expiration: 604800000
  issuer: foodv-backend

mercadopago:
  access-token: TEST-placeholder
  public-key: TEST-placeholder
  webhook-secret: placeholder
  notification-url: http://localhost:8080/api/payments/webhook

cloudinary:
  cloud-name: placeholder
  api-key: placeholder
  api-secret: placeholder